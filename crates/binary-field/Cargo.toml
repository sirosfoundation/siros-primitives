[package]
name = "binary-field"
version = "0.1.0"
description = "Binary Galois fields GF(2^n) of any degree, declared by their polynomial, with every algorithm choice folded at compile time"
readme = "README.md"
keywords = ["gf2", "galois-field", "binary-field", "clmul", "gcm"]
categories = ["mathematics", "cryptography", "no-std", "no-std::no-alloc"]
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
# The default build carries at most 16 KiB of lookup tables per field.
default = []
# The fastest tables, of any size: every product of the fields up to degree 8, logarithms and
# antilogarithms from degree 9 to 16 in builds without hardware carry-less products, every square,
# square root and inverse up to degree 16, and byte tables of the Frobenius powers of the
# inverses from degree 17 to 128.
precomputed = []
# No lookup table: every operation computes, as `ConstantTime` does. It wins over `precomputed`.
not-precomputed = []

[dependencies]
biguint = { path = "../biguint", version = "0.1.0", default-features = false }
constant-time = { path = "../constant-time", version = "0.1.0" }
clmul = { path = "../clmul", version = "0.1.0", features = ["biguint"] }
const-default.workspace = true
derive-where.workspace = true
generic-array.workspace = true
thiserror.workspace = true
typenum.workspace = true

[dev-dependencies]
bench-compare = { path = "../bench-compare" }
compile-algebra.workspace = true
core-algebra.workspace = true
g2p.workspace = true
galois_field_2pm.workspace = true
gf256.workspace = true
ghash.workspace = true
hekate-math.workspace = true
p3-binary-field.workspace = true
p3-field.workspace = true
polyval.workspace = true
reed-solomon-erasure.workspace = true
runtime-algebra.workspace = true
serde.workspace = true

[[bench]]
name = "compare"
harness = false

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
