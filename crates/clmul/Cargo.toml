[package]
name = "clmul"
version = "0.1.0"
description = "Carry-less multiplication of 64-bit words, limb slices and GF(2^128) elements, on PCLMULQDQ, PMULL or a const portable comb"
readme = "README.md"
keywords = ["clmul", "carryless", "polynomial", "gf2", "pclmulqdq"]
categories = ["mathematics", "cryptography", "no-std", "no-std::no-alloc"]
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
# The `CarrylessMul` trait and the const products of `biguint::Uint` values.
biguint = ["dep:biguint"]

[dependencies]
biguint = { path = "../biguint", version = "0.1.0", default-features = false, optional = true }

[package.metadata.docs.rs]
all-features = true

# The PCLMULQDQ and PMULL backends call `#[target_feature]` functions, and such a call takes
# `unsafe`. `unsafe_code` is `deny` here, and those two modules `expect` it. A manifest cannot
# inherit `[workspace.lints]` and change one lint, so the other workspace lints are repeated.
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unused_must_use = "deny"
unused_results = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_assignments = "deny"
unreachable_code = "deny"
unreachable_patterns = "deny"

[lints.clippy]
disallowed_types = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
wildcard_enum_match_arm = "deny"
map_err_ignore = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
must_use_candidate = "deny"
return_self_not_must_use = "deny"
result_unit_err = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
