[package]
name = "bench-compare"
version = "0.0.0"
description = "Measures one crate's operations against other crates with the CPU's performance counters and writes the BENCHMARKS.md of the comparison"
readme = "README.md"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Tests live in `tests/`. A unit-test build would compile these targets again for no test.
[lib]
test = false

[[bin]]
name = "bench-browser"
test = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix.workspace = true
perf-event2.workspace = true
tiny_http.workspace = true

# A chain barrier is inline assembly, which takes `unsafe`. `unsafe_code` is `deny` here, and the
# module of the barriers `expect`s it. A manifest cannot inherit `[workspace.lints]` and change one
# lint, so the other workspace lints are repeated.
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unused_must_use = "deny"
unused_results = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_assignments = "deny"
unreachable_code = "deny"
unreachable_patterns = "deny"

[lints.clippy]
disallowed_types = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
wildcard_enum_match_arm = "deny"
map_err_ignore = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
must_use_candidate = "deny"
return_self_not_must_use = "deny"
result_unit_err = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
