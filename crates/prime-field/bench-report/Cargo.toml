[package]
name = "prime-field-bench-report"
version = "0.0.0"
description = "Runs the benchmarks that compare prime-field with other crates and writes BENCHMARKS.md"
readme = "README.md"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# A unit-test build would compile the tool again for no test; `cargo clippy --all-targets` checks it.
[[bin]]
name = "prime-field-bench-report"
path = "src/main.rs"
test = false
bench = false

[dependencies]
bench-tools = { path = "../../bench-tools" }
serde.workspace = true

[lints]
workspace = true
