[package]
name = "prime-field"
version = "0.1.0"
description = "Prime fields declared by their modulus, with Montgomery or pseudo-Mersenne arithmetic chosen at compile time"
readme = "README.md"
keywords = ["finite-field", "prime-field", "montgomery", "cryptography", "no-std"]
categories = ["mathematics", "cryptography", "no-std", "no-std::no-alloc"]
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
biguint = { version = "0.1.0", path = "../biguint", default-features = false }
constant-time = { version = "0.1.0", path = "../constant-time" }
const-default.workspace = true
derive-where.workspace = true
generic-array.workspace = true
num-traits.workspace = true
thiserror.workspace = true
typenum.workspace = true

[dev-dependencies]
ark-bls12-381.workspace = true
ark-bn254.workspace = true
ark-ff.workspace = true
ark-secp256k1.workspace = true
ark-secp256r1.workspace = true
bench-compare = { path = "../bench-compare" }
compile-algebra.workspace = true
core-algebra.workspace = true
crypto-bigint.workspace = true
halo2curves.workspace = true
k256.workspace = true
num-bigint.workspace = true
p256.workspace = true
p3-baby-bear.workspace = true
p3-field.workspace = true
p3-goldilocks.workspace = true
p3-mersenne-31.workspace = true
runtime-algebra.workspace = true
serde.workspace = true
subtle.workspace = true
winter-math.workspace = true

# One bench per group of operations: each builds in its own LTO job, in parallel.
[[bench]]
name = "sums"
harness = false

[[bench]]
name = "products"
harness = false

[[bench]]
name = "integers"
harness = false

[lints]
workspace = true
