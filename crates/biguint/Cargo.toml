[package]
name = "biguint"
version = "0.1.0"
description = "Fixed-width big unsigned integers of any bit width, with optimal division and modular multiplication"
readme = "README.md"
keywords = ["bigint", "biguint", "uint", "u256", "arithmetic"]
categories = ["mathematics", "cryptography", "no-std", "no-std::no-alloc"]
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
# Removes the 512-byte table that seeds the division reciprocal off x86-64: a 32-bit division
# computes the seed.
not-precomputed = []

[dependencies]
const-default.workspace = true
derive-where.workspace = true
generic-array.workspace = true
num-traits.workspace = true
thiserror.workspace = true
typenum.workspace = true

[dev-dependencies]
bench-compare = { path = "../bench-compare" }
bnum.workspace = true
crypto-bigint.workspace = true
num-bigint.workspace = true
ruint = { workspace = true, features = ["num-traits"] }
serde.workspace = true
uint.workspace = true

[[bench]]
name = "compare"
harness = false

[lints]
workspace = true
