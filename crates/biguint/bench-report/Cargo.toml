[package]
name = "biguint-bench-report"
version = "0.0.0"
description = "Runs the benchmarks that compare biguint with other crates and writes BENCHMARKS.md"
readme = "README.md"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# A unit-test build would compile the tool again for no test; `cargo clippy --all-targets` checks it.
[[bin]]
name = "biguint-bench-report"
path = "src/main.rs"
test = false

[dependencies]
bench-compare = { path = "../../bench-compare" }
serde.workspace = true

[lints]
workspace = true
