[package]
name = "ct-check"
version = "0.0.0"
description = "Runs the ConstantTime operations of biguint, prime-field and binary-field under Valgrind's memcheck, which reports every branch and memory address that depends on a wrapped operand"
readme = "README.md"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# It has no test.
[[bin]]
name = "ct-check"
path = "src/main.rs"
test = false
bench = false

[dependencies]
bench-compare = { path = "../bench-compare" }
biguint = { path = "../biguint" }
binary-field = { path = "../binary-field" }
prime-field = { path = "../prime-field" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# A client request is inline assembly, which takes `unsafe`. `unsafe_code` is `deny` here, and the
# module of the requests `expect`s it. A manifest cannot inherit `[workspace.lints]` and change one
# lint, so the other workspace lints are repeated.
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unused_must_use = "deny"
unused_results = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_assignments = "deny"
unreachable_code = "deny"
unreachable_patterns = "deny"

[lints.clippy]
disallowed_types = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
wildcard_enum_match_arm = "deny"
map_err_ignore = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
must_use_candidate = "deny"
return_self_not_must_use = "deny"
result_unit_err = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
