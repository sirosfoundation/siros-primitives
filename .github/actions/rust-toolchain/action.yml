name: Install the pinned Rust toolchain
description: >
  Installs the toolchain, components and targets that rust-toolchain.toml names,
  plus the extra ones given as inputs.
inputs:
  targets:
    description: Extra comma-separated targets
    default: ""
  components:
    description: Extra comma-separated components
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        EXTRA_TARGETS: ${{ inputs.targets }}
        EXTRA_COMPONENTS: ${{ inputs.components }}
      run: |
        set -euo pipefail
        rustup toolchain install
        if [ -n "$EXTRA_TARGETS" ]; then rustup target add ${EXTRA_TARGETS//,/ }; fi
        if [ -n "$EXTRA_COMPONENTS" ]; then rustup component add ${EXTRA_COMPONENTS//,/ }; fi
        rustc --version --verbose
