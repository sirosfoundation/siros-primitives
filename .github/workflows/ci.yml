name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # `--all-features` takes `not-precomputed`, which wins over `precomputed`, and
      # `--no-default-features` is the default build: the three table configurations of
      # binary-field.
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked --workspace --no-default-features
      - run: cargo test --locked -p binary-field --features precomputed

  test-adx:
    name: Test with the adx carry intrinsics
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C target-feature=+adx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked --workspace --all-features

  test-clmul:
    name: Test clmul and binary-field with ${{ matrix.target-features }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The PCLMULQDQ backend, without and with `pextrq`, and the vector comb on AVX2.
        target-features: ["+pclmulqdq", "+pclmulqdq,+sse4.1", "+avx2"]
    env:
      RUSTFLAGS: -C target-feature=${{ matrix.target-features }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked -p clmul -p binary-field --all-features
      - run: cargo test --locked -p binary-field
      - run: cargo test --locked -p binary-field --features precomputed

  constant-time:
    name: Constant time
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends valgrind
      # Memcheck runs the `ConstantTime` operations of biguint, prime-field and binary-field on
      # undefined operands, built for x86-64 and for x86-64-v3 with ADX and PCLMULQDQ.
      - run: cargo run --locked -p ct-check

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: thumbv7em-none-eabi,aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      # biguint's default build, with the reciprocal seed table.
      - run: cargo clippy --locked -p biguint --all-targets -- -D warnings
      # The default and the `precomputed` tables of binary-field; `--all-features` has none.
      - run: cargo clippy --locked -p binary-field --all-targets -- -D warnings
      - run: cargo clippy --locked -p binary-field --all-targets --features precomputed -- -D warnings
      # A 32-bit target without `std`, `adx` or carry-less instructions: the portable carry path,
      # the comb and the `no_std` build.
      - run: cargo clippy --locked -p constant-time -p biguint -p prime-field -p clmul -p binary-field --target thumbv7em-none-eabi -- -D warnings
      # The PCLMULQDQ and PMULL backends of `clmul`, and the plans of `binary-field` on them.
      - run: cargo clippy --locked -p clmul -p binary-field --all-targets --all-features -- -D warnings
        env:
          RUSTFLAGS: -C target-feature=+pclmulqdq,+sse4.1
      # The vector comb of `clmul` on AVX2 registers.
      - run: cargo clippy --locked -p clmul -p binary-field --all-targets --all-features -- -D warnings
        env:
          RUSTFLAGS: -C target-feature=+avx2
      - run: cargo clippy --locked -p clmul -p binary-field --all-features --target aarch64-unknown-linux-gnu -- -D warnings
        env:
          RUSTFLAGS: -C target-feature=+aes

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --locked --workspace --no-deps --all-features

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml overrides the default toolchain, so RUSTUP_TOOLCHAIN selects 1.93.
      - name: Install Rust 1.93
        run: |
          rustup toolchain install 1.93 --profile minimal
          echo "RUSTUP_TOOLCHAIN=1.93" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --locked -p biguint -p prime-field
      # The `adc` and `sbb` intrinsics of builds with `adx`.
      - run: cargo check --locked -p biguint -p prime-field
        env:
          RUSTFLAGS: -C target-feature=+adx
      - run: cargo check --locked -p clmul --all-features
      - run: cargo check --locked -p binary-field
