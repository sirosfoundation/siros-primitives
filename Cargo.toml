[workspace]
resolver = "3"
members = [
  "crates/bench-compare",
  "crates/biguint",
  "crates/biguint/bench-report",
  "crates/binary-field",
  "crates/binary-field/bench-report",
  "crates/clmul",
  "crates/constant-time",
  "crates/ct-check",
  "crates/prime-field",
  "crates/prime-field/bench-report",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sirosfoundation/siros-primitives"
authors = ["SIROS Foundation"]
# The `adc` and `sbb` intrinsics that builds with `adx` call are safe from 1.93; the `msrv` CI job
# builds on it with and without `adx`.
rust-version = "1.93"

[workspace.dependencies]
const-default = { version = "1.0.0", default-features = false }
derive-where = "1.6.1"
generic-array = { version = "1.4.3", default-features = false, features = ["const-default"] }
thiserror = { version = "2.0.17", default-features = false }
typenum = { version = "1.20.1", features = ["const-generics"] }

bnum = { version = "0.14.4", default-features = false }
crypto-bigint = { version = "0.7.10", default-features = false }
num-traits = { version = "0.2.19", default-features = false }
ghash = { version = "0.6.0", default-features = false }
nix = { version = "0.31.3", default-features = false, features = ["sched"] }
num-bigint = { version = "0.5.1", default-features = false }
perf-event2 = "0.7.4"
polyval = { version = "0.7.3", default-features = false }
ruint = { version = "1.21.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uint = { version = "0.10.2", default-features = false }

ark-bls12-381 = "0.6.0"
ark-bn254 = "0.6.0"
ark-ff = { version = "0.6.0", default-features = false }
ark-secp256k1 = { version = "0.6.0", default-features = false }
ark-secp256r1 = { version = "0.6.0", default-features = false }
halo2curves = { version = "0.10.0", default-features = false }
k256 = { version = "0.13.4", default-features = false, features = ["expose-field"] }
p256 = { version = "0.13.2", default-features = false, features = ["expose-field"] }
p3-baby-bear = "0.9.0-rc.2"
p3-field = "0.9.0-rc.2"
p3-goldilocks = "0.9.0-rc.2"
p3-mersenne-31 = "0.9.0-rc.2"
subtle = { version = "2.6.1", default-features = false }
winter-math = { version = "0.13.1", default-features = false }
compile-algebra = { git = "https://github.com/longfellow-zk/longfellow-zk", rev = "61a8a735964d1b22bccf79bf14ef6767249cdf92" }
core-algebra = { git = "https://github.com/longfellow-zk/longfellow-zk", rev = "61a8a735964d1b22bccf79bf14ef6767249cdf92" }
runtime-algebra = { git = "https://github.com/longfellow-zk/longfellow-zk", rev = "61a8a735964d1b22bccf79bf14ef6767249cdf92" }

g2p = "1.2.2"
galois_field_2pm = "0.1.0"
gf256 = "0.3.1"
hekate-math = { version = "0.12.1", default-features = false, features = ["std"] }
p3-binary-field = "0.9.0-rc.2"
reed-solomon-erasure = { version = "6.0.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unused_must_use = "deny"
unused_results = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_assignments = "deny"
unreachable_code = "deny"
unreachable_patterns = "deny"

[workspace.lints.clippy]
disallowed_types = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
wildcard_enum_match_arm = "deny"
map_err_ignore = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
must_use_candidate = "deny"
return_self_not_must_use = "deny"
result_unit_err = "deny"
